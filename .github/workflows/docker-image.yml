name: Build test Docker image

on:
  workflow_dispatch:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cainiao524/tranemission-next-vibemod-test:test
            ghcr.io/cainiao524/tranemission-next-vibemod-test:sha-${{ github.sha }}

      - name: Set package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            gh api --method PATCH \
              /user/packages/container/tranemission-next-vibemod-test/visibility \
              -f visibility=public && exit 0
            sleep 5
          done
          exit 1
